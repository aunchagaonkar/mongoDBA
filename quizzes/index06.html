  <script>
    const quizData = [
      {
            "id": 1,
            "text": "An administrator deploys a three-member replica set with the following in each `mongod.conf`:\n\n```yaml\nstorage:\n  dbPath: /var/lib/mongodb\nnet:\n  bindIp: 0.0.0.0\n  port: 27017\nreplication:\n  replSetName: replset\nsecurity:\n  authorization: enabled\n```\n\nClient authentication works, but replication never establishes and elections fail.\n\nWhat is missing from this configuration?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "`security.keyFile`, which provides the internal authentication members need to verify each other"
                  },
                  {
                        "id": "b",
                        "text": "`net.tls.mode`, which is mandatory whenever `authorization` is enabled"
                  },
                  {
                        "id": "c",
                        "text": "`replication.oplogSizeMB`, without which members cannot exchange oplog entries"
                  },
                  {
                        "id": "d",
                        "text": "`security.clusterAuthMode: scram`, which must be set explicitly for members to authenticate"
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "When access control is enabled on a replica set, members must authenticate to **each other**, not just to clients. That internal authentication comes from a shared keyfile referenced by `security.keyFile` (or from x.509 certificates). Without it, members cannot verify each other's identity, so replication and elections fail while client authentication continues to work \u2014 exactly the split symptom described.\n\n- **b** TLS is a separate concern; access control does not require it.\n- **c** the oplog is created automatically with a default size.\n- **d** `clusterAuthMode` defaults to keyfile-based authentication and is not the missing piece; the keyfile itself is.\n\n*Units: Self-Managed Security \u2014 Enabling Authentication; Replication \u2014 Deploying a Replica Set*"
      },
      {
            "id": 2,
            "text": "An administrator adds the following to `mongod.conf` and restarts the service. `mongod` fails to start.\n\n```yaml\nnet:\n  port: 27017\n  tls:\n    mode: requireTLS\n```\n\nWhat is the cause?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "`requireTLS` is not a valid mode value; the correct value is `required`."
                  },
                  {
                        "id": "b",
                        "text": "No `certificateKeyFile` is specified, so the server has no certificate to present."
                  },
                  {
                        "id": "c",
                        "text": "TLS cannot be enabled on port 27017; a dedicated TLS port must be configured."
                  },
                  {
                        "id": "d",
                        "text": "`mode` must be set to `preferTLS` first and can never be set to `requireTLS` directly in the configuration file."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "Any TLS mode other than `disabled` requires the server to present a certificate, supplied by `net.tls.certificateKeyFile`. Without it `mongod` has nothing to offer during the handshake and refuses to start. The startup failure is logged, which is where an administrator should look first.\n\n- **a** `requireTLS` is the correct value.\n- **c** MongoDB uses the same port for TLS and non-TLS connections.\n- **d** `requireTLS` can be set directly; `preferTLS` is a migration convenience, not a prerequisite.\n\n*Unit: Self-Managed Security \u2014 Enabling Network Encryption*"
      },
      {
            "id": 3,
            "text": "A user was created on the `admin` database with `readWrite` on `salesdb`. The application connects with:\n\n```text\nmongodb+srv://salesApp:<password>@cluster0.abcde.mongodb.net/salesdb?retryWrites=true&w=majority\n```\n\nThe credentials are confirmed correct, but the application receives `MongoServerError: bad auth : Authentication failed.`\n\nWhat should be changed?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Add `authSource=admin` to the connection string, because the driver is otherwise authenticating against `salesdb`."
                  },
                  {
                        "id": "b",
                        "text": "Add the client's IP address to the Atlas Network Access allowlist."
                  },
                  {
                        "id": "c",
                        "text": "Change `w=majority` to `w=1`, because majority write concern requires an elevated role."
                  },
                  {
                        "id": "d",
                        "text": "Recreate the user on `salesdb` instead, because `readWrite` cannot be granted across databases."
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "The database named in the connection string path is also the **authentication database** unless `authSource` says otherwise. Here the driver tries to authenticate `salesApp` against `salesdb`, where the user does not exist, so authentication fails despite correct credentials. Adding `authSource=admin` points authentication at the database where the user was created.\n\n- **b** would address a `MongoServerSelectionError`, not `bad auth`.\n- **c** write concern has no bearing on authentication.\n- **d** is false \u2014 a user on `admin` can hold roles scoped to any database, which is the standard pattern.\n\n*Units: Connecting to a MongoDB Database \u2014 Troubleshooting Connection Errors; Self-Managed Security \u2014 Establishing Authorization*"
      },
      {
            "id": 4,
            "text": "An administrator creates `/etc/mongosh.conf` with the following content, then opens a new shell. The batch size is still the default.\n\n```yaml\ndisplayBatchSize: 50\n```\n\nWhat is wrong?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The option belongs in `~/.mongoshrc.js`; `mongosh.conf` accepts only telemetry settings."
                  },
                  {
                        "id": "b",
                        "text": "The options must be nested under a top-level `mongosh:` key."
                  },
                  {
                        "id": "c",
                        "text": "`displayBatchSize` must be written as `display_batch_size` in the configuration file."
                  },
                  {
                        "id": "d",
                        "text": "The file must be JSON, not YAML."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "`mongosh` configuration files are YAML with all options nested under a top-level `mongosh:` key. A bare key at the document root is ignored, which is why the shell silently keeps the default.\n\n```yaml\nmongosh:\n  displayBatchSize: 50\n```\n\n- **a** is wrong on both counts; `mongosh.conf` handles far more than telemetry.\n- **c** the option name is correct as written.\n- **d** the file is YAML.\n\n*Unit: The MongoDB Shell \u2014 Configuring the MongoDB Shell*"
      },
      {
            "id": 5,
            "text": "A query on an `invoices` collection filters on `region` with an equality match, filters on `amount` with a range, and sorts by `issuedAt` descending.\n\nWhich of the following indexes will still leave a blocking in-memory `SORT` stage in the plan?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "`{ region: 1, issuedAt: -1, amount: 1 }`"
                  },
                  {
                        "id": "b",
                        "text": "`{ region: 1, amount: 1, issuedAt: -1 }`"
                  },
                  {
                        "id": "c",
                        "text": "`{ region: 1, issuedAt: -1 }`"
                  },
                  {
                        "id": "d",
                        "text": "`{ region: 1, issuedAt: -1, amount: -1 }`"
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "Apply ESR. The query has equality on `region`, a **sort** on `issuedAt`, and a **range** on `amount`. Option (b) places the range field before the sort field, which breaks the index's ability to return documents in `issuedAt` order \u2014 so a blocking `SORT` remains. Options (a) and (d) follow Equality \u2192 Sort \u2192 Range correctly. Option (c) omits `amount` entirely, so the range is applied as a post-scan filter, but the sort is still served by the index and no blocking sort occurs.\n\n*Unit: Indexes II \u2014 Optimized Compound Indexes*"
      },
      {
            "id": 6,
            "text": "A database administrator has two viable indexes on a collection and has confirmed with `explain(\"allPlansExecution\")` that the query planner is choosing the less selective one for a particular reporting query, producing a much higher key count than the alternative.\n\nWhat is the appropriate way to make that query use the better index?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Drop the index the planner is choosing, so only the better one remains."
                  },
                  {
                        "id": "b",
                        "text": "Append `hint()` to the query, specifying the index to use."
                  },
                  {
                        "id": "c",
                        "text": "Hide the less selective index with `hideIndex()` permanently."
                  },
                  {
                        "id": "d",
                        "text": "Recreate the better index so it is the most recently built and therefore preferred."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "`hint()` instructs MongoDB to use a specified index for a query, which is the targeted way to override a planner choice for one query without affecting anything else.\n\n- **a** drops an index other queries may depend on, to fix one query.\n- **c** hiding the index has the same collateral effect as dropping it for every other query, and permanently hiding an index you intend to keep is not the tool's purpose \u2014 it exists to test removal.\n- **d** build order does not influence plan selection.\n\n*Unit: Indexes II \u2014 Index Usage Details via Explain; Clustered Indexes (hint)*"
      },
      {
            "id": 7,
            "text": "`$indexStats` on an `accounts` collection reports the following for one index:\n\n```js\n{\n  name: \"email_1\",\n  key: { email: 1 },\n  accesses: { ops: Long(\"0\"), since: ISODate(\"2026-05-02T00:00:00Z\") },\n  spec: { unique: true }\n}\n```\n\nThe administrator is compiling a list of indexes to drop in order to reduce write overhead.\n\nHow should this index be treated?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Drop it \u2014 three months with zero operations is conclusive evidence it is unnecessary."
                  },
                  {
                        "id": "b",
                        "text": "Do not drop it on usage alone: it is a unique index, so it is enforcing a constraint on writes even though no read operation has used it."
                  },
                  {
                        "id": "c",
                        "text": "Drop it, then recreate it as a sparse index, which carries no write cost."
                  },
                  {
                        "id": "d",
                        "text": "Hide it permanently, which removes the write overhead while preserving the constraint."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "A unique index does two jobs: it can serve queries, and it **enforces a constraint on every write**. `$indexStats` counts only the first. Zero read operations therefore proves the index is unused for queries while saying nothing about the constraint it is enforcing. Dropping it would silently permit duplicate email values.\n\n- **a** treats usage statistics as the whole picture, which is the trap.\n- **c** is false; a sparse index still carries write cost, and sparseness would also change which documents the constraint covers.\n- **d** is false; a hidden index is still maintained on every write and still enforces uniqueness, so hiding it saves nothing.\n\n*Units: Indexes II \u2014 How to Monitor Indexes; Indexes \u2014 Creating a Single Field Index*"
      },
      {
            "id": 8,
            "text": "The following entry appears in `mongod.log`:\n\n```json\n{\n  \"t\": { \"$date\": \"2026-07-28T11:02:44.310+00:00\" },\n  \"s\": \"I\",\n  \"c\": \"COMMAND\",\n  \"ctx\": \"conn4471\",\n  \"msg\": \"Slow query\",\n  \"attr\": {\n    \"ns\": \"shop.orders\",\n    \"planSummary\": \"COLLSCAN\",\n    \"keysExamined\": 0,\n    \"docsExamined\": 1840221,\n    \"nreturned\": 6,\n    \"durationMillis\": 3187\n  }\n}\n```\n\nWhat does this entry indicate, and what is the appropriate response?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The query is using a multikey index inefficiently; rebuild the index with a different key order."
                  },
                  {
                        "id": "b",
                        "text": "No index supports this query, so MongoDB examined 1.84 million documents to return six; run `explain()` and create a supporting index."
                  },
                  {
                        "id": "c",
                        "text": "The `mongod` process is short of memory, since `keysExamined` is zero; increase the cache size."
                  },
                  {
                        "id": "d",
                        "text": "The query is already covered, since `keysExamined` is zero; the duration reflects network transfer only."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "`planSummary: \"COLLSCAN\"` with `keysExamined: 0` means no index was used at all. MongoDB read 1,840,221 documents to return 6, taking 3.2 seconds. The response is to run `explain()` on the query and build an index that supports its filter and sort.\n\n- **a** contradicts the plan summary; there is no index in use.\n- **c** misreads `keysExamined: 0`, which reflects the absence of an index scan, not memory pressure.\n- **d** inverts the meaning \u2014 a covered query shows `docsExamined: 0`, not `keysExamined: 0`.\n\n*Units: Logging Basics \u2014 MongoDB Log Events; Indexes II \u2014 Index Usage Details via Explain*"
      },
      {
            "id": 9,
            "text": "Immediately before a planned rolling maintenance window, `rs.status()` returns the following for one member:\n\n```js\n{\n  name: \"mongod2.replset.com:27017\",\n  health: 1,\n  state: 3,\n  stateStr: \"RECOVERING\"\n}\n```\n\nWhat should the administrator do?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Proceed \u2014 `health: 1` confirms the member is available, and `RECOVERING` members are upgraded the same way as secondaries."
                  },
                  {
                        "id": "b",
                        "text": "Halt the maintenance until the member reaches `SECONDARY`, because performing maintenance while a member's state is unclear risks data corruption or loss."
                  },
                  {
                        "id": "c",
                        "text": "Remove the member from the replica set, perform the maintenance on the remaining two, then re-add it."
                  },
                  {
                        "id": "d",
                        "text": "Force the member to `SECONDARY` with `rs.reconfig()` and continue."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "`RECOVERING` means the member is not currently able to serve reads and is working toward a consistent state. MongoDB's pre-maintenance guidance is explicit: no member should be in `ROLLBACK` or `RECOVERING`, because acting while a member's state is unresolved sharply raises the risk of corrupting or losing data. Wait for `SECONDARY`, and investigate why it is recovering.\n\n- **a** misreads `health: 1`, which reports reachability, not readiness.\n- **c** removing members is unnecessary and would reduce the set's fault tolerance during the very window when it is most needed.\n- **d** `rs.reconfig()` cannot force a member's state.\n\n*Units: Upgrades & Maintenance \u2014 MongoDB Server Upgrades; Replication \u2014 Configuring a Replica Set*"
      },
      {
            "id": 10,
            "text": "Pre-upgrade checks on a three-member replica set return the following feature compatibility versions:\n\n- `mongod0`: 5.0\n- `mongod1`: 5.0\n- `mongod2`: 4.4\n\nWhat should the administrator do before upgrading the deployment to 6.0?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Nothing \u2014 the upgrade sets all members to a common feature compatibility version automatically."
                  },
                  {
                        "id": "b",
                        "text": "Investigate and align all members on the same feature compatibility version first, since a mismatch indicates the previous upgrade did not complete."
                  },
                  {
                        "id": "c",
                        "text": "Upgrade `mongod2` to 6.0 first, which will bring its feature compatibility version forward two releases at once."
                  },
                  {
                        "id": "d",
                        "text": "Set every member's feature compatibility version to 6.0 now, then upgrade the binaries."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "Every member should report the **same** feature compatibility version before an upgrade. A member sitting at 4.4 while the others are at 5.0 indicates the previous upgrade did not complete \u2014 most likely `setFeatureCompatibilityVersion` was never run, or was run while that member was unavailable. Resolve that before layering another upgrade on top.\n\n- **a** is false; FCV is never aligned automatically.\n- **c** is false; major versions must be installed consecutively, and FCV does not advance two releases at once.\n- **d** ignores the anomaly rather than investigating it, and setting FCV forward on a member whose history is unclear compounds the problem.\n\n*Unit: Upgrades & Maintenance \u2014 MongoDB Server Upgrades*"
      },
      {
            "id": 11,
            "text": "A junior administrator submits the following plan for upgrading a replica set from 5.0 to 6.0:\n\n1. Confirm oplog window and member states.\n2. Set `setFeatureCompatibilityVersion` to `\"6.0\"`.\n3. Gracefully shut down and upgrade each secondary in turn.\n4. Step down the primary and upgrade it.\n\nWhich step is out of order, and where does it belong?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Step 1 should come after step 3, since member states change during the upgrade."
                  },
                  {
                        "id": "b",
                        "text": "Step 2 should come last, after every member is running the new binary."
                  },
                  {
                        "id": "c",
                        "text": "Step 4 should come before step 3, so the primary runs the newest binary throughout."
                  },
                  {
                        "id": "d",
                        "text": "The plan is correct as written."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "`setFeatureCompatibilityVersion` is the **last** step, run only after every member is running the new binary. Raising it early enables features that persist data in a format the not-yet-upgraded members cannot read, and it also forecloses a straightforward downgrade if the upgrade goes badly.\n\n- **a** the pre-checks belong at the start; that is their purpose.\n- **c** the primary is upgraded last, by stepping down first so a writable primary remains available throughout.\n- **d** the plan is not correct as written.\n\n*Unit: Upgrades & Maintenance \u2014 MongoDB Server Upgrades*"
      },
      {
            "id": 12,
            "text": "A backup was produced with `mongodump --db=orders --out=/backups/nightly`. During a recovery drill, the administrator runs `mongorestore --oplogReplay /backups/nightly`.\n\nWhat happens?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The restore succeeds and applies the oplog entries captured during the dump."
                  },
                  {
                        "id": "b",
                        "text": "The restore fails or has nothing to replay, because the dump was taken without `--oplog` and therefore contains no `oplog.bson`."
                  },
                  {
                        "id": "c",
                        "text": "The restore succeeds but silently skips indexes, since `--oplogReplay` implies `--noIndexRestore`."
                  },
                  {
                        "id": "d",
                        "text": "The restore replays the target deployment's current oplog, rolling it forward to the present moment."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "`--oplogReplay` replays the `oplog.bson` file that `mongodump --oplog` produces. This dump was taken without `--oplog`, so there is no such file and there is nothing to replay \u2014 the restore has no point-in-time capability regardless of the flag used at restore time. Point-in-time consistency is decided when the **backup** is taken, not when it is restored.\n\n- **a** assumes an oplog that was never captured.\n- **c** invents an implication between unrelated options.\n- **d** is not what `--oplogReplay` does; it never reads the target's live oplog.\n\n*Units: Self-Managed Backup & Recovery \u2014 Backing Up and Restoring a Deployment; DBA Tools \u2014 Backup and Restore Tools*"
      },
      {
            "id": 13,
            "text": "An administrator documents the following snapshot procedure:\n\n1. `db.fsyncLock()`\n2. `lvcreate --size 100M --snapshot --name mdb-snap /dev/vg0/mongodb`\n3. Mount the snapshot read-only.\n4. `tar -czvf /backups/mdb.tar.gz /mnt/mdb-snap`\n5. Copy the archive to the backup host.\n\nWhat is the critical omission?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "`db.fsyncUnlock()` is never run, so the deployment remains unable to accept writes after the procedure."
                  },
                  {
                        "id": "b",
                        "text": "The snapshot should be created before the database is locked, so writes are captured."
                  },
                  {
                        "id": "c",
                        "text": "`bsondump` must be run on the snapshot before it can be archived."
                  },
                  {
                        "id": "d",
                        "text": "The `mongod` service must be stopped between steps 1 and 2."
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "`db.fsyncLock()` blocks writes and holds them blocked until `db.fsyncUnlock()` is called. The procedure locks the database in step 1 and never unlocks it, so the deployment stops accepting writes for the entire archive-and-copy operation \u2014 and stays that way afterwards. The unlock belongs immediately after the snapshot is created in step 2; the snapshot itself is instantaneous, so the write pause should last seconds, not the duration of the archiving.\n\n- **b** inverts the sequence; the lock exists to make the snapshot consistent.\n- **c** `bsondump` reads `.bson` dump files, not filesystem snapshots.\n- **d** stopping `mongod` defeats the purpose of snapshotting a running deployment.\n\n*Unit: Self-Managed Backup & Recovery \u2014 Snapshot Volumes; Filesystem Archives*"

            ],
            "explanation": "`readAnyDatabase` grants read access to every database on the deployment, which directly contradicts the requirement that the account never read application data. It should be removed. The other two are the standard monitoring grants: `clusterMonitor` supplies diagnostic commands such as `serverStatus` and `replSetGetStatus`, and `read` on `local` is needed for replication metrics.\n\n*Units: Self-Managed Security \u2014 Establishing Authorization; Database Metrics & Monitoring \u2014 Self-Managed Monitoring*\n\n---\n\n## Coverage Map\n\n| Topic area | Questions | Count |\n|---|---|---|\n| Security: internal auth, TLS, roles | 1, 2, 14, 30 | 4 |\n| Connecting & shell configuration | 3, 4 | 2 |\n| Indexing, explain & index hygiene | 5, 6, 7, 8 | 4 |\n| Replication states & concerns | 9, 18, 20, 21, 29 | 5 |\n| Upgrades & maintenance | 10, 11 | 2 |\n| Backup & recovery | 12, 13 | 2 |\n| Logging | 15 | 1 |\n| Metrics & monitoring response | 16, 17, 19 | 3 |\n| CRUD diagnostics | 22 | 1 |\n| DBA tools | 23, 24, 25 | 3 |\n| Data modeling assessment | 26, 27 | 2 |\n| Sharded clusters | 28 | 1 |\n\n**Scoring guide:** applied questions are harder than recall questions, so calibrate differently \u2014 25+ = strong; 20\u201324 = solid; below 20 means the underlying facts are probably known but not yet automatic enough to apply under pressure.\n\n## What This Set Was Testing\n\nEach question maps to a fact covered in Sets 1\u20135, but asks something the earlier format did not:\n\n- **Configuration consequences.** Knowing that a keyfile provides internal authentication is one thing; recognising *client auth works but replication fails* as the symptom of its absence is another (Q1). Same for `certificateKeyFile` (Q2) and `authSource` (Q3).\n- **Sequencing.** The upgrade steps and the TLS rollout steps are individually familiar; the exam asks which one is in the wrong place (Q11, Q14).\n- **Metrics as evidence rather than facts.** Q17 gives you two metrics moving in opposite directions and asks what the *combination* means. Q19 asks which of four working solutions creates a new risk.\n- **When the obvious answer is wrong.** An unused index that enforces uniqueness should not be dropped (Q7). A well-modelled schema should not be \"improved\" (Q27). Lowering write concern cannot fix a missing primary (Q20).\n- **Silent failure modes.** Upsert with a mistyped filter field inserts instead of updating, with no error (Q22). A bare key in `mongosh.conf` is ignored, with no error (Q4). `list` versus `search` in `mongofiles` returns nothing rather than complaining (Q25).\n\n## Cumulative Coverage \u2014 All Six Sets\n\nYou now have 180 questions.\n\n| Topic area | S1 | S2 | S3 | S4 | S5 | S6 | Total |\n|---|---|---|---|---|---|---|---|\n| Indexing, explain & profiling | 9 | 7 | 4 | 4 | 4 | 4 | 32 |\n| Security | 5 | 5 | \u2014 | 4 | 4 | 4 | 22 |\n| Replication | 4 | 3 | 3 | 4 | 3 | 5 | 22 |\n| CRUD & query results | 3 | 4 | 4 | 3 | \u2014 | 1 | 15 |\n| Metrics & monitoring | 1 | 2 | 4 | 2 | 3 | 3 | 15 |\n| Backup & recovery | 2 | 2 | 2 | 2 | 3 | 2 | 13 |\n| Data modeling & document model | 2 | 1 | 4 | 3 | 1 | 2 | 13 |\n| DBA tools | 1 | 1 | 2 | 3 | 2 | 3 | 12 |\n| Logging | 1 | 2 | 2 | 2 | 2 | 1 | 10 |\n| Upgrades & maintenance | 1 | 2 | 1 | \u2014 | 3 | 2 | 9 |\n| Shell & connecting | \u2014 | \u2014 | 4 | 2 | \u2014 | 2 | 8 |\n| Sharded clusters | 1 | 1 | \u2014 | 1 | 1 | 1 | 5 |\n| Atlas platform | \u2014 | \u2014 | \u2014 | \u2014 | 4 | \u2014 | 4 |"
      }
];

    // State tracking
    let answeredQuestions = {}; // q.id -> { isCorrect: bool, userSelected: [] }

    function formatText(rawText) {
      let text = rawText
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      text = text.replace(/```(js|json|text|yaml)?\n([\s\S]*?)\n```/g, function(match, lang, code) {
        return `<pre><code>${code}</code></pre>`;
      });

      text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return text;
    }

    function renderQuiz() {
      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";

      quizData.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `qCard_${q.id}`;

        const inputType = q.isMulti ? "checkbox" : "radio";
        const inputName = `q_${q.id}`;
        const badgeText = q.isMulti ? "Select all that apply" : "Select one";

        let optionsHTML = "";
        q.options.forEach(opt => {
          optionsHTML += `
            <li class="option-item" id="optContainer_${q.id}_${opt.id}">
              <input type="${inputType}" name="${inputName}" value="${opt.id}" id="input_${q.id}_${opt.id}">
              <label class="option-label" for="input_${q.id}_${opt.id}">
                <strong>${opt.id.toUpperCase()}.</strong> ${formatText(opt.text)}
              </label>
            </li>
          `;
        });

        card.innerHTML = `
          <div class="question-header">
            <div class="question-title">
              Question ${index + 1}
              <span class="badge">${badgeText}</span>
            </div>
            <button type="button" class="btn-submit-q" id="btnSubmit_${q.id}" onclick="submitQuestion(${q.id})">Submit Answer</button>
          </div>
          <div class="question-text">${formatText(q.text)}</div>
          <ul class="options-list">
            ${optionsHTML}
          </ul>
          <div class="explanation" id="exp_${q.id}">
            <strong>Explanation:</strong> ${formatText(q.explanation)}
          </div>
        `;

        container.appendChild(card);
      });

      updateScoreBoard();
    }

    function submitQuestion(qId) {
      const q = quizData.find(item => item.id === qId);
      if (!q) return;

      const inputName = `q_${q.id}`;
      const selectedInputs = document.querySelectorAll(`input[name="${inputName}"]:checked`);
      const userSelected = Array.from(selectedInputs).map(i => i.value);

      if (userSelected.length === 0) {
        if (!confirm("You haven't selected any option. Are you sure you want to submit?")) {
          return;
        }
      }

      const correctAnswers = q.answer;
      const isCorrect = userSelected.length === correctAnswers.length &&
        userSelected.every(val => correctAnswers.includes(val));

      // Save state
      answeredQuestions[q.id] = { isCorrect, userSelected };

      // Add submitted class to card to reveal explanation
      const card = document.getElementById(`qCard_${q.id}`);
      card.classList.add("q-submitted");

      // Highlight options for this question
      q.options.forEach(opt => {
        const optElement = document.getElementById(`optContainer_${q.id}_${opt.id}`);
        const isRightAnswer = correctAnswers.includes(opt.id);
        const isSelected = userSelected.includes(opt.id);

        if (isRightAnswer) {
          optElement.classList.add("correct-answer");
        } else if (isSelected && !isRightAnswer) {
          optElement.classList.add("wrong-selected");
        }
      });

      // Disable inputs and button for this question
      const qInputs = document.querySelectorAll(`input[name="${inputName}"]`);
      qInputs.forEach(i => i.disabled = true);
      document.getElementById(`btnSubmit_${q.id}`).disabled = true;

      updateScoreBoard();
    }

    function submitAll() {
      quizData.forEach(q => {
        if (!answeredQuestions[q.id]) {
          submitQuestion(q.id);
        }
      });
    }

    function updateScoreBoard() {
      const answeredCount = Object.keys(answeredQuestions).length;
      let correctCount = 0;

      for (let qId in answeredQuestions) {
        if (answeredQuestions[qId].isCorrect) {
          correctCount++;
        }
      }

      document.getElementById("correctCount").innerText = correctCount;
      document.getElementById("answeredCount").innerText = answeredCount;
      document.getElementById("totalCount").innerText = quizData.length;
    }

    function resetQuiz() {
      answeredQuestions = {};
      document.body.classList.remove("submitted");

      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize quiz on load
    renderQuiz();
  </script>
