      {
            "id": 1,
            "text": "A team is moving an application from a proof of concept to production. Their requirements include a dedicated cluster with isolated resources, the Performance Advisor for index recommendations, the Real-Time Performance Panel, and Online Archive for infrequently accessed data.\n\nWhat is the minimum Atlas cluster tier that satisfies all of these?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "M0"
                  },
                  {
                        "id": "b",
                        "text": "Serverless"
                  },
                  {
                        "id": "c",
                        "text": "M10"
                  },
                  {
                        "id": "d",
                        "text": "M30"
                  }
            ],
            "answer": [
                  "c"
            ],
            "explanation": "Performance Advisor, the Real-Time Performance Panel, and Online Archive all require **M10 or above**, and M10 is the entry point for dedicated clusters, where resources are not shared with other tenants. M10 is therefore the *minimum* that satisfies every requirement.\n\n- **a** M0 is the free shared tier: no dedicated resources and none of the three features.\n- **b** serverless bills for consumption and does not provide dedicated cluster resources or these features.\n- **d** M30 satisfies the requirements but is not the minimum \u2014 read the question.\n\n*Unit: Getting Started with Atlas \u2014 Deploying an Atlas Cluster; Exploring the Atlas UI*"
      },
      {
            "id": 2,
            "text": "An engineering department has one Atlas organization. It needs development, testing, and production environments with separate resources, separate database users, and separate network access rules, while keeping billing and organization-level settings unified.\n\nHow should the department structure this in Atlas?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Create three separate organizations, one per environment."
                  },
                  {
                        "id": "b",
                        "text": "Create three projects within the existing organization, one per environment."
                  },
                  {
                        "id": "c",
                        "text": "Deploy all three environments as clusters in a single project, distinguished by cluster names."
                  },
                  {
                        "id": "d",
                        "text": "Create three databases within one cluster, one per environment."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "Projects are the unit of resource isolation inside an organization: each has its own clusters, database users, and network access rules, while the organization above them retains billing and organization-wide settings. Separate projects per environment is the documented pattern.\n\n- **a** separate organizations fragment billing and organization settings, which the requirement rules out.\n- **c** one project for everything is explicitly discouraged \u2014 it weakens access control and resource organisation.\n- **d** databases within a cluster share the cluster's users and network rules, so nothing is isolated.\n\n*Unit: Getting Started with Atlas \u2014 Deploying an Atlas Cluster*"
      },
      {
            "id": 3,
            "text": "A database administrator is asked to produce a summary of a cluster's performance over the previous month and opens the Real-Time Performance Panel for an M30 cluster.\n\nWhy is this the wrong tool for the request?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The panel reports current and very recent activity \u2014 live operations, hardware statistics, and network traffic \u2014 and does not present historical data over extended periods."
                  },
                  {
                        "id": "b",
                        "text": "The panel is available only on M0 and serverless clusters, so it cannot be opened for an M30."
                  },
                  {
                        "id": "c",
                        "text": "The panel reports only network traffic, so hardware and operation data must come from another source."
                  },
                  {
                        "id": "d",
                        "text": "The panel aggregates data weekly, so a monthly view requires four separate exports."
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "The Real-Time Performance Panel is a live view: current operations, hardware statistics such as CPU, disk IOPS and memory, and network traffic including current connections and bytes in and out per second. It is not a historical reporting tool, so a month-long summary must come from the cluster's metrics charts instead.\n\n- **b** inverts the tier requirement \u2014 the panel needs M10 or above, so an M30 qualifies.\n- **c** understates its scope; hardware and operation data are included.\n- **d** invents a weekly aggregation.\n\n*Unit: Getting Started with Atlas \u2014 Exploring the Atlas UI*"
      },
      {
            "id": 4,
            "text": "During a design review, a developer argues that because MongoDB has a flexible schema, the team does not need to spend time on data modeling \u2014 documents can simply be inserted in whatever shape the application produces.\n\nWhat is the accurate response?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The developer is correct; a flexible schema removes the need for schema design, because MongoDB optimises document layout automatically."
                  },
                  {
                        "id": "b",
                        "text": "A flexible schema means the database does not enforce a structure by default; it does not remove the need to model data around the application's access patterns."
                  },
                  {
                        "id": "c",
                        "text": "The developer is correct for collections under 16 MB in total size, beyond which a fixed schema becomes mandatory."
                  },
                  {
                        "id": "d",
                        "text": "A flexible schema applies only to documents within a single collection, so modeling is needed only when a database has more than one collection."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "A flexible schema means MongoDB does not *enforce* a document structure by default, so documents in one collection may differ. It does not mean structure is unimportant. MongoDB's central modeling principle \u2014 data that is accessed together should be stored together \u2014 is a design decision the team still has to make, driven by the application's query and update patterns. Flexibility changes when you can revise the model, not whether you need one.\n\n- **a** is the misconception being tested; MongoDB does not reorganise documents for you.\n- **c** invents a size threshold.\n- **d** invents a scope limitation.\n\n*Units: Document Model \u2014 Overview of the Document Model; Data Modeling \u2014 Introduction to Data Modeling*"
      },
      {
            "id": 5,
            "text": "A database administrator must drop a compound index on a `shipments` collection but does not know the index's auto-generated name.\n\nWhich approach removes the index?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Run `db.shipments.getIndexes()` to read the index name, then `db.shipments.dropIndex(\"<name>\")` \u2014 or pass the index's key document to `dropIndex()` directly."
                  },
                  {
                        "id": "b",
                        "text": "Run `db.shipments.stats()` to read the index name, then `db.shipments.deleteIndex(\"<name>\")`."
                  },
                  {
                        "id": "c",
                        "text": "Run `db.shipments.dropIndexes()`, which is the only way to remove an index whose name is unknown."
                  },
                  {
                        "id": "d",
                        "text": "Run `db.shipments.hideIndex()` first, since an index must be hidden before it can be dropped."
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "`getIndexes()` returns every index on the collection with its name and key pattern. `dropIndex()` then accepts either the name or the key document, so once you have the output you can use whichever is convenient.\n\n- **b** `deleteIndex()` does not exist, and `stats()` does not list index names.\n- **c** `dropIndexes()` would remove every index rather than the one intended.\n- **d** hiding is a way to *test* removal, not a prerequisite for it.\n\n*Unit: Indexes \u2014 Deleting MongoDB Indexes*"
      },
      {
            "id": 6,
            "text": "A database administrator drops an index that a frequently run reporting query had been using. The application team reports that the report still produces the correct figures, but now takes far longer to run.\n\nWhat explains this?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The query is returning cached results from before the index was dropped, which will expire shortly."
                  },
                  {
                        "id": "b",
                        "text": "The query now uses a collection scan, examining every document to find matches, which yields the same results with far more work."
                  },
                  {
                        "id": "c",
                        "text": "Dropping the index invalidated the query's plan cache, and performance will recover automatically once a new plan is cached."
                  },
                  {
                        "id": "d",
                        "text": "The query is being rejected and silently retried by the driver until it succeeds."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "An index is a performance structure, not a correctness one. Without it, the query planner falls back to a `COLLSCAN` and examines every document in the collection, producing identical results with far more work. This is why dropping an index is a performance risk rather than an availability risk \u2014 and why `hideIndex()` exists to test the impact reversibly.\n\n- **a** MongoDB does not cache query *results*.\n- **c** the plan cache is invalidated, but a new plan for a collection scan is still a collection scan; performance does not recover on its own.\n- **d** no retry occurs; nothing failed.\n\n*Unit: Indexes \u2014 Deleting MongoDB Indexes; Working with Compound Indexes*"
      },
      {
            "id": 7,
            "text": "A database administrator suspects a handful of operations on a self-managed deployment are exceeding 50 milliseconds and wants to capture those operations in a form that can be queried and analysed afterwards, rather than only reading them from the log file.\n\nWhich approach achieves this?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Run `db.setProfilingLevel(1, { slowms: 50 })`, then query the `system.profile` collection."
                  },
                  {
                        "id": "b",
                        "text": "Run `db.setProfilingLevel(0, { slowms: 50 })`, then query the `system.profile` collection."
                  },
                  {
                        "id": "c",
                        "text": "Run `db.setLogLevel(2)`, then query the `system.profile` collection."
                  },
                  {
                        "id": "d",
                        "text": "Run `db.setProfilingLevel(2, { slowms: 50 })`, then run `show log global`."
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "Profiling level **1** writes operations slower than `slowms` into the `system.profile` collection, which can then be queried like any other collection \u2014 sorted by duration, filtered by namespace, and so on. `system.profile` is a capped collection, so older entries are eventually overwritten.\n\n- **b** level 0 disables the profiler; `slowms` would still govern the diagnostic log, but nothing is written to `system.profile`.\n- **c** `setLogLevel()` changes log verbosity and does not populate `system.profile`.\n- **d** level 2 profiles every operation regardless of `slowms`, and `show log global` reads log messages rather than profiler documents.\n\n*Units: Indexes II \u2014 How to Monitor Indexes; Logging Basics \u2014 Server Log Customizations*"
      },
      {
            "id": 8,
            "text": "A time series collection named `readings` was created with `timeField: \"timestamp\"` and `metaField: \"sensor\"`. Queries filter by a specific sensor over a time range, and they are slower than the team expects.\n\nWhat should the database administrator do?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Create a secondary index on the `metaField` and `timeField`."
                  },
                  {
                        "id": "b",
                        "text": "Convert the collection to a clustered collection, since time series collections cannot be indexed."
                  },
                  {
                        "id": "c",
                        "text": "Increase the `granularity` setting to `hours`, which rebuilds the existing buckets."
                  },
                  {
                        "id": "d",
                        "text": "Create a wildcard index on the collection, since time series field names are dynamic."
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "Time series collections support secondary indexes, and the recommended index for this access pattern covers the `metaField` and the `timeField` \u2014 which is exactly how the query filters. That lets MongoDB narrow to the relevant buckets rather than scanning more of the collection.\n\n- **b** is false on its premise; time series collections can be indexed.\n- **c** changing granularity does not rebuild existing buckets, and a coarser granularity is not a fix for a missing index.\n- **d** wildcard indexes address unknown *field names*; the field names here are known.\n\n*Unit: Indexes II \u2014 Time Series Collections*"
      },
      {
            "id": 9,
            "text": "A database administrator is about to begin a rolling MongoDB upgrade on a replica set. Each member will be offline for roughly three hours. Pre-upgrade checks return the following:\n\n- `rs.printReplicationInfo()` reports an oplog window of 6 hours.\n- `rs.printSecondaryReplicationInfo()` shows one secondary is currently 4 hours behind the primary.\n\nWhat should the administrator do?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Proceed with the lagging secondary first, since it is already behind and has the least to lose."
                  },
                  {
                        "id": "b",
                        "text": "Postpone the upgrade until the lagging secondary has caught up, because taking it down for three hours would push it beyond the oplog window and force a full initial sync."
                  },
                  {
                        "id": "c",
                        "text": "Proceed as planned, because the 6-hour oplog window exceeds the 3-hour outage per member."
                  },
                  {
                        "id": "d",
                        "text": "Increase the oplog size on the lagging secondary only, then proceed immediately."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "This is the integration the pre-upgrade checklist exists for. The oplog window is 6 hours, but the lagging secondary has already consumed 4 hours of it. Taking that member down for a 3-hour upgrade puts its total distance behind the primary at roughly 7 hours \u2014 past the window \u2014 so the entries it needs to resume replication will have been overwritten and it will require a full initial sync. MongoDB's guidance is to confirm secondaries are not still catching up before starting maintenance.\n\n- **a** inverts the risk; the lagging member is the most exposed, not the least.\n- **c** compares the window against the outage alone and ignores the 4 hours already spent \u2014 the trap in the question.\n- **d** the oplog window is a property of each member's own oplog, and resizing one member's oplog does not recover entries the *source* has already overwritten; it also does nothing about the existing 4-hour deficit.\n\n*Units: Upgrades & Maintenance \u2014 Zero Downtime Maintenance, MongoDB Server Upgrades; Replication \u2014 The MongoDB Operation Log*"
      },
      {
            "id": 10,
            "text": "A three-member replica set is being reduced to two data-bearing members plus an arbiter. The administrator needs to remove one existing secondary, `mongod3.replset.com:27017`, from the set.\n\nWhich command removes it?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "`rs.stepDown(\"mongod3.replset.com:27017\")`"
                  },
                  {
                        "id": "b",
                        "text": "`rs.remove(\"mongod3.replset.com:27017\")`"
                  },
                  {
                        "id": "c",
                        "text": "`rs.freeze(\"mongod3.replset.com:27017\")`"
                  },
                  {
                        "id": "d",
                        "text": "`db.adminCommand({ dropMember: \"mongod3.replset.com:27017\" })`"
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "`rs.remove(\"<host>:<port>\")` removes a member from the replica set configuration. The equivalent is retrieving the configuration with `rs.conf()`, deleting the member from `config.members`, and applying it with `rs.reconfig()`.\n\n- **a** `rs.stepDown()` demotes a primary and takes no member argument of this kind.\n- **c** `rs.freeze()` prevents a member from seeking election for a period; it does not remove it.\n- **d** `dropMember` is not a MongoDB command.\n\n*Unit: Replication \u2014 Configuring a Replica Set in a MongoDB Deployment*"
      },
      {
            "id": 11,
            "text": "A read-only dashboard is deployed in several regions and reads from a globally distributed replica set. The priority is the lowest possible read latency for each regional deployment; slightly stale data is acceptable, and reads from the primary are also acceptable if the primary happens to be closest.\n\nWhich read preference fits?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "`primary`"
                  },
                  {
                        "id": "b",
                        "text": "`secondary`"
                  },
                  {
                        "id": "c",
                        "text": "`nearest`"
                  },
                  {
                        "id": "d",
                        "text": "`secondaryPreferred`"
                  }
            ],
            "answer": [
                  "c"
            ],
            "explanation": "`nearest` routes each read to the member with the lowest network latency from the client, whether that member is the primary or a secondary. For geographically distributed readers whose only priority is latency, that is the fitting choice.\n\n- **a** `primary` sends every read to one region, which is the opposite of the goal.\n- **b** `secondary` excludes the primary even when the primary is closest \u2014 the requirement explicitly permits it.\n- **d** `secondaryPreferred` prefers secondaries and only falls back to the primary when none is available; it does not select on latency.\n\n*Unit: Replication \u2014 Read and Write Concerns*"
      },
      {
            "id": 12,
            "text": "Before beginning an upgrade, a database administrator must record both the MongoDB version currently running and the feature compatibility version currently in effect.\n\nWhich pair of commands provides this?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "`db.version()` and `db.adminCommand({ getParameter: 1, featureCompatibilityVersion: 1 })`"
                  },
                  {
                        "id": "b",
                        "text": "`db.serverStatus().version` and `rs.conf().featureCompatibilityVersion`"
                  },
                  {
                        "id": "c",
                        "text": "`db.version()` and `db.adminCommand({ setFeatureCompatibilityVersion: 1 })`"
                  },
                  {
                        "id": "d",
                        "text": "`show dbs` and `db.stats().fcv`"
                  }
            ],
            "answer": [
                  "a"
            ],
            "explanation": "`db.version()` returns the running server version. The feature compatibility version is read with `db.adminCommand({ getParameter: 1, featureCompatibilityVersion: 1 })`. Both belong on the pre-upgrade checklist, along with confirming every member reports the same FCV.\n\n- **b** `rs.conf()` holds replica set configuration, not the FCV.\n- **c** `setFeatureCompatibilityVersion` **changes** the value rather than reading it \u2014 and running it during a pre-upgrade audit would be a mistake.\n- **d** neither command exists in that form.\n\n*Unit: Upgrades & Maintenance \u2014 MongoDB Server Upgrades*"
      },
      {
            "id": 13,
            "text": "A replica set was upgraded to 6.0 several weeks ago, and `setFeatureCompatibilityVersion` was set to `\"6.0\"` at the time. An application incompatibility has now been discovered, and the team wants to downgrade the binaries to 5.0.\n\nWhat must happen before the binaries can be downgraded?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "Nothing additional; binaries can be downgraded at any time and the feature compatibility version adjusts automatically."
                  },
                  {
                        "id": "b",
                        "text": "The feature compatibility version must be set back to `\"5.0\"` first, because 6.0 may have persisted data using features that 5.0 cannot read."
                  },
                  {
                        "id": "c",
                        "text": "The oplog must be resized to match the 5.0 default before the downgrade."
                  },
                  {
                        "id": "d",
                        "text": "Every member must be removed from the replica set and re-added after the downgrade."
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "The feature compatibility version gates features that **persist data** in formats earlier releases cannot read. Once FCV is `\"6.0\"`, 6.0-only on-disk formats may already be present, so the FCV must be set back to `\"5.0\"` \u2014 allowing MongoDB to remove or rewrite anything incompatible \u2014 before the binaries are downgraded. This is the reason the guidance is to leave FCV at the old value until you are confident you will not need to downgrade.\n\n- **a** is the dangerous assumption; nothing adjusts automatically.\n- **c** and **d** invent unrelated prerequisites.\n\n*Unit: Upgrades & Maintenance \u2014 MongoDB Server Upgrades*"
      },
      {
            "id": 14,
            "text": "A database administrator has developed a new compound index and a revised query for a production reporting workload. The change needs realistic validation \u2014 against representative data volumes and a copy of the production configuration \u2014 before users are exposed to it.\n\nWhich environment is intended for this?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The development environment, where the index was written"
                  },
                  {
                        "id": "b",
                        "text": "The pre-production environment"
                  },
                  {
                        "id": "c",
                        "text": "The production environment, using a hidden index"
                  },
                  {
                        "id": "d",
                        "text": "A local `mongod` instance on the administrator's workstation"
                  }
            ],
            "answer": [
                  "b"
            ],
            "explanation": "The **pre-production** environment exists for rigorous testing against representative data and configuration before a change reaches users. Testing there is what keeps a change from becoming an incident.\n\n- **a** the development environment is for building features, and its testing is less rigorous by design.\n- **c** hiding an index in production is a legitimate technique for measuring the impact of *removing* one, but it is not a substitute for validating a new index and query outside production.\n- **d** a workstation instance cannot reproduce production data volumes or configuration.\n\n*Unit: Upgrades & Maintenance \u2014 Zero Downtime Maintenance with a MongoDB Deployment*"
      },
      {
            "id": 15,
            "text": "A database administrator reviewing an Atlas cluster observes three things at once, beginning at the same time yesterday:\n\n- Query Targeting has risen to roughly 900 scanned objects per document returned.\n- Tickets Available for reads is falling toward zero during business hours.\n- The Connections count is climbing steadily.\n\nWhich single explanation accounts for all three observations?",
            "isMulti": false,
            "options": [
                  {
                        "id": "a",
                        "text": "The oplog has been undersized, so secondaries are lagging and consuming read capacity."

        q.options.forEach(opt => {
          optionsHTML += `
            <li class="option-item" id="optContainer_${q.id}_${opt.id}">
              <input type="${inputType}" name="${inputName}" value="${opt.id}" id="input_${q.id}_${opt.id}">
              <label class="option-label" for="input_${q.id}_${opt.id}">
                <strong>${opt.id.toUpperCase()}.</strong> ${formatText(opt.text)}
              </label>
            </li>
          `;
        });

        card.innerHTML = `
          <div class="question-header">
            <div class="question-title">
              Question ${index + 1}
              <span class="badge">${badgeText}</span>
            </div>
            <button type="button" class="btn-submit-q" id="btnSubmit_${q.id}" onclick="submitQuestion(${q.id})">Submit Answer</button>
          </div>
          <div class="question-text">${formatText(q.text)}</div>
          <ul class="options-list">
            ${optionsHTML}
          </ul>
          <div class="explanation" id="exp_${q.id}">
            <strong>Explanation:</strong> ${formatText(q.explanation)}
          </div>
        `;

        container.appendChild(card);
      });

      updateScoreBoard();
    }

    function submitQuestion(qId) {
      const q = quizData.find(item => item.id === qId);
      if (!q) return;

      const inputName = `q_${q.id}`;
      const selectedInputs = document.querySelectorAll(`input[name="${inputName}"]:checked`);
      const userSelected = Array.from(selectedInputs).map(i => i.value);

      if (userSelected.length === 0) {
        if (!confirm("You haven't selected any option. Are you sure you want to submit?")) {
          return;
        }
      }

      const correctAnswers = q.answer;
      const isCorrect = userSelected.length === correctAnswers.length &&
        userSelected.every(val => correctAnswers.includes(val));

      // Save state
      answeredQuestions[q.id] = { isCorrect, userSelected };

      // Add submitted class to card to reveal explanation
      const card = document.getElementById(`qCard_${q.id}`);
      card.classList.add("q-submitted");

      // Highlight options for this question
      q.options.forEach(opt => {
        const optElement = document.getElementById(`optContainer_${q.id}_${opt.id}`);
        const isRightAnswer = correctAnswers.includes(opt.id);
        const isSelected = userSelected.includes(opt.id);

        if (isRightAnswer) {
          optElement.classList.add("correct-answer");
        } else if (isSelected && !isRightAnswer) {
          optElement.classList.add("wrong-selected");
        }
      });

      // Disable inputs and button for this question
      const qInputs = document.querySelectorAll(`input[name="${inputName}"]`);
      qInputs.forEach(i => i.disabled = true);
      document.getElementById(`btnSubmit_${q.id}`).disabled = true;

      updateScoreBoard();
    }

    function submitAll() {
      quizData.forEach(q => {
        if (!answeredQuestions[q.id]) {
          submitQuestion(q.id);
        }
      });
    }

    function updateScoreBoard() {
      const answeredCount = Object.keys(answeredQuestions).length;
      let correctCount = 0;

      for (let qId in answeredQuestions) {
        if (answeredQuestions[qId].isCorrect) {
          correctCount++;
        }
      }

      document.getElementById("correctCount").innerText = correctCount;
      document.getElementById("answeredCount").innerText = answeredCount;
      document.getElementById("totalCount").innerText = quizData.length;
    }

    function resetQuiz() {
      answeredQuestions = {};
      document.body.classList.remove("submitted");

      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize quiz on load
    renderQuiz();
  </script>
</body>
</html>
